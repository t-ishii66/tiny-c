title: "tiny-c — Build Your Own C Compiler in 1500 Lines"
description: >-
  A free, open-source educational C compiler tutorial in seven chapters.
  Build a working C compiler in about 1500 lines of C, targeting x86-64
  Linux. Learn lexical analysis with flex, parsing with bison, abstract
  syntax tree (AST) construction, code generation to x86-64 assembly,
  the System V AMD64 ABI calling convention, lvalue/rvalue handling,
  pointers, arrays, global variables, string literals, function calls,
  recursion, printf, block scope, constant folding, algebraic
  simplification, peephole optimization, and backpatching. The compiler
  source and documentation walk through every line. Available in English
  and Japanese. Keywords: C compiler tutorial, build your own compiler,
  write a compiler in C, learn compilers, compiler from scratch,
  compiler construction, programming language implementation, teaching
  compiler, small C compiler, educational compiler, x86-64 assembly,
  compiler design, lexer parser AST code generation.

url: "https://t-ishii66.github.io"
baseurl: "/tiny-c"
repository: t-ishii66/tiny-c

theme: jekyll-theme-cayman

author: t-ishii66
lang: en

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Keep these out of the published site
exclude:
  - "*.bak"
  - PROBLEMS.md
  - "*PROBLEMS*.md"
  - Makefile
  - tinyc
  - build/
  - steps/
  - test/
  - .github/
  - .gitignore
  - .vscode/
  - "*.c"
  - "*.h"
  - "*.s"
  - "*.o"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
