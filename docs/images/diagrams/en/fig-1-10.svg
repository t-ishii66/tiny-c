<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="14" fill="#1a202c">
  <style>
    .box { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.5; }
    .var { fill: #f4f6f8; stroke: #718096; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .note { font-size: 13px; fill: #2d3748; }
    .tag { font-size: 11px; fill: #4a6fa5; }
    .line { stroke: #4a5568; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="720" height="520" fill="#ffffff"/>

  <!-- input file -->
  <rect class="box" x="40" y="20" width="180" height="56" rx="8"/>
  <text x="130" y="53" text-anchor="middle" font-size="15">Input file</text>
  <text class="note" x="250" y="42">source written in tiny-c</text>
  <text class="note code" x="250" y="64" font-size="12">int main() { return 42; }</text>
  <line class="line" x1="130" y1="76" x2="130" y2="118" marker-end="url(#a)"/>

  <!-- yyin -->
  <rect class="var" x="40" y="120" width="180" height="56" rx="8"/>
  <text class="code" x="130" y="153" text-anchor="middle" font-size="15">yyin</text>
  <text class="note" x="250" y="153">global variable of type <tspan class="code">FILE *</tspan></text>
  <line class="line" x1="130" y1="176" x2="130" y2="218" marker-end="url(#a)"/>

  <!-- yylex -->
  <rect class="box" x="40" y="220" width="180" height="56" rx="8"/>
  <text class="code" x="130" y="253" text-anchor="middle" font-size="15">yylex()</text>
  <text class="tag" x="212" y="236" text-anchor="end">from flex</text>
  <text class="note" x="250" y="253">returns one token per call</text>
  <line class="line" x1="130" y1="276" x2="130" y2="318" marker-end="url(#a)"/>

  <!-- yyparse -->
  <rect class="box" x="40" y="320" width="180" height="56" rx="8"/>
  <text class="code" x="130" y="353" text-anchor="middle" font-size="15">yyparse()</text>
  <text class="tag" x="212" y="336" text-anchor="end">from bison</text>
  <text class="note" x="250" y="353">builds the tree, calling yylex inside</text>
  <!-- yyparse calls yylex: a curved arrow back up -->
  <path class="line" d="M40,348 C10,348 10,248 38,248" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line class="line" x1="130" y1="376" x2="130" y2="418" marker-end="url(#a)"/>

  <!-- program -->
  <rect class="var" x="40" y="420" width="180" height="56" rx="8"/>
  <text class="code" x="130" y="453" text-anchor="middle" font-size="15">program</text>
  <text class="note" x="250" y="453">global variable that holds the AST root</text>

  <!-- legend -->
  <rect class="box" x="470" y="490" width="22" height="14" rx="3"/>
  <text class="tag" x="498" y="501">function</text>
  <rect class="var" x="566" y="490" width="22" height="14" rx="3"/>
  <text class="tag" x="594" y="501">global variable</text>
</svg>
