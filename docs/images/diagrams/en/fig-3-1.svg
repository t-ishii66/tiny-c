<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="14" fill="#1a202c">
  <style>
    .sys { fill: #f4f6f8; stroke: #718096; stroke-width: 1.5; }
    .var { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.5; }
    .free { fill: #ffffff; stroke: #cbd5e0; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .off { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #4a6fa5; }
    .note { font-size: 12px; fill: #4a5568; }
    .addr { font-size: 12px; fill: #718096; }
    .ptr { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #b86b14; font-weight: bold; }
    .line { stroke: #4a5568; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dd8a2a"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0aec0"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>

  <text class="addr" x="30" y="30">high address</text>
  <line x1="60" y1="40" x2="60" y2="278" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#g)"/>
  <text class="addr" x="30" y="300">low address</text>

  <rect class="sys" x="180" y="30" width="250" height="46"/>
  <text x="305" y="58" text-anchor="middle">caller's return address</text>
  <text class="off" x="445" y="58">+8(%rbp)</text>

  <rect class="sys" x="180" y="76" width="250" height="46"/>
  <text x="305" y="104" text-anchor="middle">caller's saved <tspan class="code">%rbp</tspan></text>
  <text class="off" x="445" y="104">0(%rbp)</text>

  <rect class="var" x="180" y="122" width="250" height="46"/>
  <text class="code" x="305" y="150" text-anchor="middle">x = 1</text>
  <text class="off" x="445" y="150">-8(%rbp)</text>
  <text class="note" x="545" y="150">allocated by the 1st <tspan class="code">subq $8</tspan></text>

  <rect class="var" x="180" y="168" width="250" height="46"/>
  <text class="code" x="305" y="196" text-anchor="middle">y = 2</text>
  <text class="off" x="445" y="196">-16(%rbp)</text>
  <text class="note" x="545" y="196">allocated by the 2nd <tspan class="code">subq $8</tspan></text>

  <rect class="free" x="180" y="214" width="250" height="60"/>
  <text class="addr" x="305" y="249" text-anchor="middle">(free)</text>

  <!-- pointers -->
  <text class="ptr" x="96" y="104">%rbp</text>
  <line x1="140" y1="99" x2="176" y2="99" stroke="#dd8a2a" stroke-width="1.5" marker-end="url(#o)"/>
  <text class="ptr" x="96" y="196">%rsp</text>
  <line x1="140" y1="191" x2="176" y2="191" stroke="#dd8a2a" stroke-width="1.5" marker-end="url(#o)"/>
</svg>
