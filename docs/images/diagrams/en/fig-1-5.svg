<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="14" fill="#1a202c">
  <style>
    .tok { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.4; }
    .node { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.5; }
    .leaf { fill: #f4f6f8; stroke: #718096; stroke-width: 1.5; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; }
    .tag { font-size: 12px; fill: #4a5568; }
    .edge { stroke: #4a5568; stroke-width: 1.3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#ffffff"/>

  <text class="tag" x="24" y="22">Tokens</text>
  <rect class="tok" x="32" y="30" width="40" height="30" rx="5"/><text class="code" x="52" y="50" text-anchor="middle">INT</text>
  <rect class="tok" x="80" y="30" width="104" height="30" rx="5"/><text class="code" x="132" y="50" text-anchor="middle">IDENT(main)</text>
  <rect class="tok" x="192" y="30" width="40" height="30" rx="5"/><text class="code" x="212" y="50" text-anchor="middle">'('</text>
  <rect class="tok" x="240" y="30" width="40" height="30" rx="5"/><text class="code" x="260" y="50" text-anchor="middle">')'</text>
  <rect class="tok" x="288" y="30" width="40" height="30" rx="5"/><text class="code" x="308" y="50" text-anchor="middle">'{'</text>
  <rect class="tok" x="336" y="30" width="64" height="30" rx="5"/><text class="code" x="368" y="50" text-anchor="middle">RETURN</text>
  <rect class="tok" x="408" y="30" width="104" height="30" rx="5"/><text class="code" x="460" y="50" text-anchor="middle">INT_LIT(42)</text>
  <rect class="tok" x="520" y="30" width="40" height="30" rx="5"/><text class="code" x="540" y="50" text-anchor="middle">';'</text>
  <rect class="tok" x="568" y="30" width="40" height="30" rx="5"/><text class="code" x="588" y="50" text-anchor="middle">'}'</text>

  <line x1="320" y1="66" x2="320" y2="114" stroke="#4a5568" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="tag" x="332" y="96">parser</text>

  <text class="tag" x="24" y="132">AST</text>
  <line class="edge" x1="320" y1="148" x2="320" y2="182"/>
  <line class="edge" x1="320" y1="210" x2="320" y2="244"/>
  <line class="edge" x1="320" y1="272" x2="320" y2="306"/>
  <rect class="node" x="258" y="120" width="124" height="28" rx="6"/><text class="code" x="320" y="139" text-anchor="middle">FUNC_DEF main</text>
  <rect class="node" x="285" y="182" width="70" height="28" rx="6"/><text class="code" x="320" y="201" text-anchor="middle">BLOCK</text>
  <rect class="node" x="281" y="244" width="78" height="28" rx="6"/><text class="code" x="320" y="263" text-anchor="middle">RETURN</text>
  <rect class="leaf" x="273" y="306" width="94" height="28" rx="6"/><text class="code" x="320" y="325" text-anchor="middle">INT_LIT 42</text>

  <text class="tag" x="320" y="364" text-anchor="middle">Parentheses and <tspan class="code">;</tspan> are dropped from the tree</text>
</svg>
