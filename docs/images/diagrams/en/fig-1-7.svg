<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 110" width="480" height="110" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="14" fill="#1a202c">
  <style>
    .tok { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.4; }
    .leaf { fill: #f4f6f8; stroke: #718096; stroke-width: 1.5; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; }
    .tag { font-size: 12px; fill: #4a5568; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="480" height="110" fill="#ffffff"/>

  <text class="tag" x="82" y="24" text-anchor="middle">Token</text>
  <rect class="tok" x="30" y="34" width="104" height="30" rx="5"/>
  <text class="code" x="82" y="54" text-anchor="middle">INT_LIT(42)</text>

  <line x1="140" y1="49" x2="290" y2="49" stroke="#4a5568" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="tag" x="215" y="40" text-anchor="middle">action of the expr rule</text>
  <text class="tag code" x="215" y="70" text-anchor="middle">new_int_lit(42)</text>

  <text class="tag" x="350" y="24" text-anchor="middle">Node</text>
  <rect class="leaf" x="296" y="34" width="108" height="30" rx="6"/>
  <text class="code" x="350" y="54" text-anchor="middle">INT_LIT 42</text>
</svg>
