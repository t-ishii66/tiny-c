<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 569 269" width="569" height="269" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="14" fill="#1a202c">
