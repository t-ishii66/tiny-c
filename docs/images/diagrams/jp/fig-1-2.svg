<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="14" fill="#1a202c">
  <style>
    .box { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.5; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sub { font-size: 12px; fill: #4a5568; }
    .note { font-size: 13px; fill: #2d3748; }
    .edge { font-size: 12px; fill: #4a6fa5; }
    .line { stroke: #4a5568; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="720" height="640" fill="#ffffff"/>

  <!-- 1. test.c -->
  <rect class="box" x="40" y="20" width="180" height="60" rx="8"/>
  <text class="code" x="130" y="55" text-anchor="middle" font-size="15">test.c</text>
  <text class="note" x="250" y="44">人間が書いた tiny-c ソース</text>
  <text class="note code" x="250" y="66" font-size="12">int main() { return 42; }</text>
  <line class="line" x1="130" y1="80" x2="130" y2="124" marker-end="url(#a)"/>

  <!-- 2. lexer -->
  <rect class="box" x="40" y="126" width="180" height="60" rx="8"/>
  <text class="code" x="130" y="153" text-anchor="middle" font-size="15">lexer.l</text>
  <text class="sub code" x="130" y="173" text-anchor="middle">(lex.yy.c)</text>
  <text class="note" x="250" y="150">flex が C コードを生成</text>
  <text class="note" x="250" y="172">文字列をトークンに分解する</text>
  <line class="line" x1="130" y1="186" x2="130" y2="230" marker-end="url(#a)"/>
  <text class="edge code" x="144" y="213">int, main, (, ), {, return, 42, ;, }</text>

  <!-- 3. parser -->
  <rect class="box" x="40" y="232" width="180" height="70" rx="8"/>
  <text class="code" x="130" y="262" text-anchor="middle" font-size="15">parser.y</text>
  <text class="sub code" x="130" y="283" text-anchor="middle">(parser.tab.c)</text>
  <text class="note" x="250" y="252">bison が C コードを生成</text>
  <text class="note" x="250" y="273">トークン列から木を組み立てる</text>
  <text class="note" x="250" y="294">途中で ast.c のコンストラクタを呼ぶ</text>
  <line class="line" x1="130" y1="302" x2="130" y2="346" marker-end="url(#a)"/>

  <!-- 4. Node tree -->
  <rect class="box" x="40" y="348" width="180" height="56" rx="8"/>
  <text x="130" y="381" text-anchor="middle" font-size="15">Node 木</text>
  <text class="note" x="250" y="381">メモリ上の AST</text>
  <line class="line" x1="130" y1="404" x2="130" y2="448" marker-end="url(#a)"/>

  <!-- 5. codegen -->
  <rect class="box" x="40" y="450" width="180" height="56" rx="8"/>
  <text class="code" x="130" y="483" text-anchor="middle" font-size="15">codegen.c</text>
  <text class="note" x="250" y="483">木を辿ってアセンブリを出力</text>
  <line class="line" x1="130" y1="506" x2="130" y2="550" marker-end="url(#a)"/>

  <!-- 6. test.s -->
  <rect class="box" x="40" y="552" width="180" height="56" rx="8"/>
  <text class="code" x="130" y="585" text-anchor="middle" font-size="15">test.s</text>
  <text class="note" x="250" y="585">x86 アセンブリ</text>
</svg>
