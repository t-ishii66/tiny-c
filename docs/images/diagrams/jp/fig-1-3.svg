<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="14" fill="#1a202c">
  <style>
    .src { fill: #f7fafc; stroke: #a0aec0; stroke-width: 1.5; }
    .tok { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.4; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; }
    .tag { font-size: 12px; fill: #4a5568; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="640" height="160" fill="#ffffff"/>

  <text class="tag" x="190" y="43" text-anchor="end">文字列</text>
  <rect class="src" x="200" y="20" width="240" height="36" rx="6"/>
  <text class="code" x="320" y="43" text-anchor="middle">"int main() { return 42; }"</text>

  <line x1="320" y1="58" x2="320" y2="102" stroke="#4a5568" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="tag" x="332" y="85">字句解析器</text>

  <text class="tag" x="24" y="98">トークン列</text>
  <rect class="tok" x="32" y="108" width="40" height="30" rx="5"/><text class="code" x="52" y="128" text-anchor="middle">INT</text>
  <rect class="tok" x="80" y="108" width="104" height="30" rx="5"/><text class="code" x="132" y="128" text-anchor="middle">IDENT(main)</text>
  <rect class="tok" x="192" y="108" width="40" height="30" rx="5"/><text class="code" x="212" y="128" text-anchor="middle">'('</text>
  <rect class="tok" x="240" y="108" width="40" height="30" rx="5"/><text class="code" x="260" y="128" text-anchor="middle">')'</text>
  <rect class="tok" x="288" y="108" width="40" height="30" rx="5"/><text class="code" x="308" y="128" text-anchor="middle">'{'</text>
  <rect class="tok" x="336" y="108" width="64" height="30" rx="5"/><text class="code" x="368" y="128" text-anchor="middle">RETURN</text>
  <rect class="tok" x="408" y="108" width="104" height="30" rx="5"/><text class="code" x="460" y="128" text-anchor="middle">INT_LIT(42)</text>
  <rect class="tok" x="520" y="108" width="40" height="30" rx="5"/><text class="code" x="540" y="128" text-anchor="middle">';'</text>
  <rect class="tok" x="568" y="108" width="40" height="30" rx="5"/><text class="code" x="588" y="128" text-anchor="middle">'}'</text>
</svg>
