<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="14" fill="#1a202c">
  <style>
    .src { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.5; }
    .gen { fill: #f4f6f8; stroke: #718096; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .tool { fill: #fff1dc; stroke: #dd8a2a; stroke-width: 1.5; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; }
    .sub { font-size: 12px; fill: #4a5568; }
    .line { stroke: #4a5568; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="560" height="120" fill="#ffffff"/>

  <rect class="src" x="20" y="30" width="130" height="44" rx="8"/>
  <text class="code" x="85" y="57" text-anchor="middle">lexer.l</text>
  <text class="sub" x="85" y="94" text-anchor="middle">私たちが書く</text>

  <line class="line" x1="150" y1="52" x2="214" y2="52" marker-end="url(#a)"/>
  <rect class="tool" x="216" y="34" width="90" height="36" rx="18"/>
  <text class="code" x="261" y="57" text-anchor="middle">flex</text>
  <line class="line" x1="306" y1="52" x2="370" y2="52" marker-end="url(#a)"/>

  <rect class="gen" x="372" y="30" width="160" height="44" rx="8"/>
  <text class="code" x="452" y="57" text-anchor="middle">lex.yy.c</text>
  <text class="sub" x="452" y="94" text-anchor="middle">字句解析器の C コード</text>
</svg>
