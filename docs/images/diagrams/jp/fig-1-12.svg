<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="14" fill="#1a202c">
  <style>
    .stmt { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.5; }
    .list { fill: #f4f6f8; stroke: #718096; stroke-width: 1.5; }
    .leaf { fill: #f4f6f8; stroke: #718096; stroke-width: 1.5; }
    .var { fill: #fff1dc; stroke: #dd8a2a; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; }
    .hd { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; font-weight: bold; }
    .sep { stroke: #cbd5e0; stroke-width: 1; }
    .ptr { stroke: #4a5568; stroke-width: 1.5; fill: none; }
    .tag { font-size: 12px; fill: #4a5568; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="780" height="460" fill="#ffffff"/>

  <!-- program (global variable) -->
  <rect class="var" x="20" y="36" width="100" height="32" rx="6"/>
  <text class="code" x="70" y="57" text-anchor="middle">program</text>
  <text class="tag" x="70" y="88" text-anchor="middle">グローバル変数</text>
  <circle cx="110" cy="52" r="3.5" fill="#4a5568"/>
  <line class="ptr" x1="110" y1="52" x2="148" y2="52" marker-end="url(#a)"/>

  <!-- D: FUNC_DEF -->
  <rect class="stmt" x="150" y="20" width="200" height="68" rx="6"/>
  <text class="hd" x="162" y="37">D: FUNC_DEF</text>
  <line class="sep" x1="150" y1="44" x2="350" y2="44"/>
  <text class="code" x="162" y="62">name = "main"</text>
  <text class="code" x="162" y="80">body</text>
  <circle cx="330" cy="76" r="3.5" fill="#4a5568"/>
  <line class="ptr" x1="330" y1="76" x2="330" y2="118" marker-end="url(#a)"/>

  <!-- C: BLOCK -->
  <rect class="stmt" x="250" y="120" width="200" height="50" rx="6"/>
  <text class="hd" x="262" y="137">C: BLOCK</text>
  <line class="sep" x1="250" y1="144" x2="450" y2="144"/>
  <text class="code" x="262" y="162">stmts</text>
  <circle cx="430" cy="158" r="3.5" fill="#4a5568"/>
  <line class="ptr" x1="430" y1="158" x2="430" y2="198" marker-end="url(#a)"/>

  <!-- L: NodeList -->
  <rect class="list" x="350" y="200" width="200" height="68" rx="6"/>
  <text class="hd" x="362" y="217">L: NodeList</text>
  <line class="sep" x1="350" y1="224" x2="550" y2="224"/>
  <text class="code" x="362" y="242">node</text>
  <text class="code" x="362" y="260">next = NULL</text>
  <circle cx="530" cy="238" r="3.5" fill="#4a5568"/>
  <line class="ptr" x1="530" y1="238" x2="530" y2="298" marker-end="url(#a)"/>

  <!-- B: RETURN -->
  <rect class="stmt" x="450" y="300" width="200" height="50" rx="6"/>
  <text class="hd" x="462" y="317">B: RETURN</text>
  <line class="sep" x1="450" y1="324" x2="650" y2="324"/>
  <text class="code" x="462" y="342">expr</text>
  <circle cx="630" cy="338" r="3.5" fill="#4a5568"/>
  <line class="ptr" x1="630" y1="338" x2="630" y2="378" marker-end="url(#a)"/>

  <!-- A: INT_LIT -->
  <rect class="leaf" x="550" y="380" width="200" height="50" rx="6"/>
  <text class="hd" x="562" y="397">A: INT_LIT</text>
  <line class="sep" x1="550" y1="404" x2="750" y2="404"/>
  <text class="code" x="562" y="422">int_val = 42</text>

  <text class="tag" x="20" y="300">● から出る矢印 = ポインタ</text>
  <text class="tag" x="20" y="318">（そのフィールドが指すノード）</text>
</svg>
