<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="14" fill="#1a202c">
  <style>
    .panel { fill: #f7fafc; stroke: #a0aec0; stroke-width: 1.5; }
    .node { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.4; }
    .leaf { fill: #f4f6f8; stroke: #718096; stroke-width: 1.4; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; }
    .head { font-size: 13px; font-weight: bold; fill: #2d3748; }
    .tag { font-size: 11px; fill: #4a5568; }
    .line { stroke: #4a5568; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="780" height="250" fill="#ffffff"/>

  <!-- source -->
  <text class="head" x="115" y="24" text-anchor="middle">ソースコード</text>
  <rect class="panel" x="20" y="36" width="190" height="190" rx="8"/>
  <text class="code" x="34" y="66">int main() {</text>
  <text class="code" x="50" y="88">return 42;</text>
  <text class="code" x="34" y="110">}</text>

  <line class="line" x1="218" y1="130" x2="262" y2="130" marker-end="url(#a)"/>
  <text class="tag" x="240" y="120" text-anchor="middle">解析</text>

  <!-- AST -->
  <text class="head" x="370" y="24" text-anchor="middle">木 (AST)</text>
  <rect class="panel" x="270" y="36" width="200" height="190" rx="8"/>
  <path d="M296,74 L296,99 L312,99 M324,113 L324,139 L340,139 M352,153 L352,179 L368,179" fill="none" stroke="#a0aec0" stroke-width="1.3"/>
  <rect class="node" x="284" y="48" width="130" height="26" rx="5"/><text class="code" x="294" y="66">FUNC_DEF main</text>
  <rect class="node" x="312" y="87" width="70" height="26" rx="5"/><text class="code" x="322" y="105">BLOCK</text>
  <rect class="node" x="340" y="127" width="78" height="26" rx="5"/><text class="code" x="350" y="145">RETURN</text>
  <rect class="leaf" x="368" y="167" width="94" height="26" rx="5"/><text class="code" x="378" y="185">INT_LIT 42</text>

  <line class="line" x1="478" y1="130" x2="522" y2="130" marker-end="url(#a)"/>
  <text class="tag" x="500" y="120" text-anchor="middle">codegen</text>

  <!-- assembly -->
  <text class="head" x="645" y="24" text-anchor="middle">アセンブリ</text>
  <rect class="panel" x="530" y="36" width="230" height="190" rx="8"/>
  <text class="code" x="546" y="66">main:</text>
  <text class="code" x="562" y="90">pushq %rbp</text>
  <text class="code" x="562" y="114">movq %rsp, %rbp</text>
  <text class="code" x="562" y="138">movl $42, %eax</text>
  <text class="code" x="562" y="162">leave</text>
  <text class="code" x="562" y="186">ret</text>
</svg>
